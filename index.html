<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors Game</title>
</head>
<body>
    <h1>Rock Paper Scissors Game</h1>
    <div class="controls">
    <button class = "choice-btn" id = "rock">Rock</button>
    <button class = "choice-btn" id = "paper">Paper</button>
    <button class = "choice-btn" id = "scissors">Scissors</button>
    </div>
    <div id="results">
        <p class="round-outcome">Select your move to begin!</p>
        <p class="score-display">Human: 0 | Computer: 0</p>
        <h2 id="final-winner"></h2>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
